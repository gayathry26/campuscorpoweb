<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo-light.jpeg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/jpeg" href="/logo-dark.jpeg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/jpeg" href="/logo-light.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusCorp — IT Career Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var path = window.location.pathname;
          var isMarketing = path === '/' || path.startsWith('/platform') || path.startsWith('/about') || path.startsWith('/contact') || path.startsWith('/company-explorer') || path.startsWith('/career-explorer') || path.startsWith('/solutions') || path.startsWith('/features');
          if (isMarketing) {
            document.documentElement.classList.remove('dark');
            return;
          }
          var mode = localStorage.getItem('campuscorp_theme_mode');
          if (mode === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
